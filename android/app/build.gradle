        buildConfigField 'String', 'COGNITO_CLIENT_ID', '"77qfbim87jlute7qh2obpr1jb1"'
        buildConfigField 'String', 'COGNITO_DOMAIN', '"https://faretrack-dev-022868553365.auth.ap-northeast-2.amazoncognito.com"'
